<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" width="1000" height="260" role="img" aria-label="Kavya Sree A - Full-Stack Developer, ML Enthusiast, AI Agent Builder">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="55%" stop-color="#111a2e"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>

    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="50%" stop-color="#8b9cff"/>
      <stop offset="100%" stop-color="#bf91f3"/>
    </linearGradient>

    <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#bf91f3" stop-opacity="0"/>
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#58a6ff" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>

    <filter id="soften" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="45"/>
    </filter>
  </defs>

  <!-- backdrop -->
  <rect width="1000" height="260" fill="url(#bg)"/>
  <rect width="1000" height="260" fill="url(#grid)"/>

  <!-- ambient glows -->
  <circle cx="180" cy="70" r="90" fill="#58a6ff" opacity="0.22" filter="url(#soften)">
    <animate attributeName="opacity" values="0.22;0.34;0.22" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="830" cy="200" r="95" fill="#bf91f3" opacity="0.20" filter="url(#soften)">
    <animate attributeName="opacity" values="0.20;0.32;0.20" dur="7s" repeatCount="indefinite"/>
  </circle>

  <!-- terminal tag -->
  <g transform="translate(500 66)" text-anchor="middle">
    <text font-family="'Fira Code',Consolas,monospace" font-size="15" fill="#7d8590">
      <tspan fill="#3fb950">~/kavya</tspan> <tspan fill="#7d8590">$</tspan> <tspan fill="#c9d1d9">whoami</tspan>
    </text>
  </g>

  <!-- name -->
  <text x="500" y="140" text-anchor="middle"
        font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="62" font-weight="800"
        fill="url(#nameGrad)" letter-spacing="1">Kavya Sree A</text>

  <!-- accent underline -->
  <rect x="330" y="158" width="340" height="2.5" rx="1.25" fill="url(#lineGrad)">
    <animate attributeName="opacity" values="0.55;1;0.55" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- tagline -->
  <text x="500" y="196" text-anchor="middle"
        font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="500" fill="#8b949e">
    Full-Stack Developer
    <tspan fill="#58a6ff" font-weight="700"> · </tspan> ML Enthusiast
    <tspan fill="#bf91f3" font-weight="700"> · </tspan> AI Agent Builder
  </text>

  <!-- credential chips -->
  <g font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600">
    <g transform="translate(336 218)">
      <rect width="146" height="27" rx="13.5" fill="#1f6feb" fill-opacity="0.16" stroke="#58a6ff" stroke-opacity="0.45"/>
      <text x="73" y="18" text-anchor="middle" fill="#79c0ff">SIH 2025 Winner</text>
    </g>
    <g transform="translate(494 218)">
      <rect width="170" height="27" rx="13.5" fill="#bf91f3" fill-opacity="0.14" stroke="#bf91f3" stroke-opacity="0.45"/>
      <text x="85" y="18" text-anchor="middle" fill="#d2a8ff">GenAI &amp; Agents</text>
    </g>
  </g>
</svg>
